name: Bug report
description: A check misfires, crashes, or a false positive/negative
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste secrets** (API keys, tokens, cookies) — redact them.
        If this is a security issue **in vibetesting-agent itself**, use the private advisory flow in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: vibetesting-agent version
      description: Output of `vibetesting-agent --version` (or the git SHA).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of bug
      options:
        - False positive (flagged something that's fine)
        - False negative (missed a real issue)
        - Crash / error
        - Wrong fix text / mapping
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: e.g. `npx github:newsengine/vibetesting-agent https://example.com --only security`
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected vs what happened
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target (if shareable)
      description: A public URL that reproduces it, or a minimal repro. Only include if you're authorized to share it.
