name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm test` runs the build, the node --test suite, and the ESLint check
      # (tests/lint.test.ts), so lint regressions fail CI like any other test.
      - run: npm ci || npm install
      - run: npm test
