# Reusable dependency audit — checks out the CALLER's repo, installs deps, runs `anal-probe audit`.
#
#   jobs:
#     deps:
#       uses: newsengine/anal-probe/.github/workflows/audit.yml@main
#       with:
#         level: high          # low | moderate | high | critical (default high)
#         prod_only: false     # audit only production deps
#         node_version: '20'
#
name: security-audit
on:
  workflow_call:
    inputs:
      level: { required: false, type: string, default: 'high' }
      prod_only: { required: false, type: boolean, default: false }
      node_version: { required: false, type: string, default: '20' }

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
      - run: npm ci || npm install
      - name: anal-probe audit
        shell: bash
        run: |
          ARGS=(audit --level "${{ inputs.level }}")
          if [ "${{ inputs.prod_only }}" = "true" ]; then ARGS+=(--prod); fi
          npx --yes github:newsengine/anal-probe "${ARGS[@]}"
